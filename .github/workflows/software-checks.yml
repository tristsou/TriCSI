name: Software checks (synthetic data)
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m tricsi doctor --code-only
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments/session_robustness/tests -v
      - run: python -m unittest discover -s experiments/session_diagnostics/tests -v
